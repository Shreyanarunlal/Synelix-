spring.application.name=synelix-backend
server.port=8080

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# H2 file-backed by default so the project runs with no external services.
# Data survives restarts under ./data/synelix.mv.db.
# For PostgreSQL run with: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:file:./data/synelix;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# Override in production: SYNELIX_JWT_SECRET must be at least 32 characters.
synelix.jwt.secret=${SYNELIX_JWT_SECRET:ZGV2LW9ubHktc3luZWxpeC1zZWNyZXQta2V5LWNoYW5nZS1tZS0zMis=}
synelix.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------------
# ML service (FastAPI)
# ---------------------------------------------------------------------------
# When unreachable the backend falls back to its own heuristic scorer.
synelix.ml.base-url=${SYNELIX_ML_URL:http://localhost:8000}
synelix.ml.connect-timeout-ms=1500
synelix.ml.read-timeout-ms=4000
synelix.ml.enabled=true

# Seed demo data on an empty database.
synelix.seed.enabled=true

logging.level.synelix_backend=INFO
