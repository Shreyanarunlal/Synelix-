# In-memory database per test run, so tests never touch the dev data file.
spring.datasource.url=jdbc:h2:mem:synelix-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

synelix.jwt.secret=test-only-secret-key-at-least-32-bytes-long!!
synelix.jwt.expiration-ms=600000

# Tests assert the fallback behaviour, so the ML service is deliberately off.
synelix.ml.enabled=false
synelix.ml.base-url=http://localhost:9
synelix.ml.connect-timeout-ms=200
synelix.ml.read-timeout-ms=200

synelix.seed.enabled=true
logging.level.root=WARN
